<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
        <lightning-layout-item class="slds-form-element__label slds-m-top_small" size="12">
            <div class="slds-text-body_regular">
                <div><strong>{uploadFileName}</strong></div>
                <div>{uploadFileStatus}</div>
            </div>
        </lightning-layout-item>
    </template>
    <template if:false={isLoading}>
        <lightning-input
            type="file"
            label={inputLabel}
            accept=".csv"
            onchange={handleInputChange}
        >
        </lightning-input>
        <lightning-layout-item class="slds-form-element__label" size="12">
            <div class="slds-text-body_regular">
                <div><strong>{uploadFileName}</strong></div>
                <div>{uploadFileStatus}</div>
            </div>
        </lightning-layout-item>
    </template>
    <template if:true={isError}>
        <lightning-layout-item class="slds-form-element__label" size="12">
            <div class="slds-box slds-theme_shade slds-theme_error slds-m-top_small">
                <div class="slds-text-body_regular" style="white-space: pre-line;">
                  {errorMessage}
                </div>
              </div>
        </lightning-layout-item>
    </template>
</template>
